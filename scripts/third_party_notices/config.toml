# Settings for generate.py, which the release workflow runs to produce the
# THIRD-PARTY-NOTICES.txt shipped in every `ant` archive and npm platform
# package.

header = """
The ant CLI is licensed under MIT OR Apache-2.0; see LICENSE-MIT and
LICENSE-APACHE. This file covers the third-party software in this build and
the tools used to produce it. Each crate's Source link is its exact source,
which is how source is made available where a licence requires it.
"""

# Licences the release may redistribute third-party code under, most preferred
# first. A crate offering a choice is redistributed under the first allowed
# option; a crate whose licence allows no option here fails generation.
allowed = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "MIT-0",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]

# Crates that may contain native code: they ship C, C++, Objective-C, CUDA or
# assembly sources or prebuilt libraries, build with cc/cmake/nasm, declare
# `links`, or are a `*-src` crate. Licence files anywhere in a crate are
# reproduced automatically; each entry records what was found on review, and
# can add licence files with other names through `files` (relative to the
# crate root, globs allowed), which count as a bundled component's unless
# `files_govern = true` marks them as the crate's own. An entry with a
# `version` applies to that release only. A crate that needs an entry and has
# none fails generation.

[native.openssl-src]
note = "builds OpenSSL 3 (The OpenSSL Project Authors) under Apache-2.0, whose openssl/LICENSE.txt is reproduced; ant-core's vendored `openssl` feature links it statically on Linux and macOS."

[native.openssl-sys]
note = "compiles a small C shim of its own, covered by the crate's licence; OpenSSL itself comes from openssl-src."

[native.zstd-sys]
note = "bundles zstd (Meta Platforms) under BSD-3-Clause (zstd/LICENSE), chosen from its BSD-3-Clause OR GPL-2.0 licence; zstd/COPYING is the GPL-2.0 alternative, reproduced only because the crate ships it."

[native.bzip2-sys]
note = "bundles bzip2 (Julian Seward) under its BSD-style licence; its LICENSE is reproduced."

[native.lzma-sys]
note = "bundles liblzma from XZ Utils, which is in the public domain (xz-*/COPYING); the GPL and LGPL texts next to it cover XZ Utils tools and scripts that lzma-sys does not build, and are reproduced only because the crate ships them."

[native.aws-lc-sys]
note = "bundles AWS-LC; its LICENSE lists each component it derives from (BoringSSL, OpenSSL, and others) with their copyright notices."

[native.aws-lc-rs]
note = "declares a `links` key but builds no native code of its own; AWS-LC comes from aws-lc-sys."

[native.ring]
note = "its C and assembly code derives from BoringSSL; LICENSE, LICENSE-BoringSSL and LICENSE-other-bits cover it."

[native.blake3]
note = "the C and assembly implementations are part of BLAKE3 and share the crate's licence."

[native.rayon-core]
note = "declares a `links` key only to prevent two copies in one build; it builds no native code."

[native.cc]
note = "a build tool; its one C file is compiled on the build machine to detect the C compiler, and nothing from it is linked."

[native.syn-solidity]
note = "a proc-macro dependency; src/ident/kw.c is a developer script that generated its keyword tables, and is not compiled."

[native.nix]
note = "its only C file is a kernel-module test fixture that is not compiled into dependants."

[native.windows_x86_64_msvc]
note = "ships the Windows import library that windows-rs links against on Windows builds; it is covered by the crate's MIT OR Apache-2.0 licence (Microsoft Corporation)."

[native.saorsa-transport]
version = "0.37.0"
note = "the published crate also contains a .minimax/ folder of AI-assistant files (Python tools and .NET DLLs) committed to its repository by mistake; nothing in it is compiled or linked into this build."

[native.sysinfo]
note = "its only C file is an example program that is not compiled into dependants."

[native.vcpkg]
note = "a build tool; its prebuilt .a files are test data, and nothing from it is linked."

# Crates whose licence the policy above does not cover, kept only after review.
# Each entry is for one reviewed version, names the licence it is
# redistributed under (whose text must be among its files), and says why that
# is acceptable.

[exception.self_encryption]
version = "0.36.0"
licence = "GPL-3.0"
reason = "GPL-3.0 with a linking exception, set out at the top of its LICENSE file, which is reproduced in full. The exception permits linking the unmodified library with independent modules into an executable distributed under other terms, provided each module's own licence terms are met; the library itself remains under GPL-3.0, and its exact source is the Source link above. Remove this entry when ant-core moves to a self_encryption release published under MIT OR Apache-2.0."

# Explanations printed with a crate's entry, for licence or notice files that
# could mislead without context.

[remark.security-framework]
note = "its THIRD_PARTY file covers documentation adapted from Apple's Security Framework under the Apple Public Source License 2.0; that documentation is not compiled into this build."

# Crates whose published files and repository contain no text of any licence
# they are offered under. Each entry is for one reviewed version; it supplies
# the canonical text of one of those licences, pinned by checksum, and says
# why it is needed. Remove an entry once the crate ships the text; generation
# prints a note when one goes unused.

[missing.saorsa-pqc]
version = "0.5.2"
text_url = "https://www.apache.org/licenses/LICENSE-2.0.txt"
text_sha256 = "cfc7749b96f63bd31c3c42b5c471bf756814053e847c10f3eb003417bc523d30"
note = "declares MIT OR Apache-2.0 but its published crate and repository contain no licence text; it is redistributed under Apache-2.0, whose text is reproduced from apache.org."

[missing.siphasher]
version = "1.0.3"
text_url = "https://raw.githubusercontent.com/spdx/license-list-data/v3.29.0/text/MIT.txt"
text_sha256 = "b05785f9f18e6716bab63424b11454513b9943a222595b70411009202fc592b5"
note = "its COPYING, reproduced with its copyright lines, refers to LICENSE-MIT and LICENSE-APACHE files that neither the crate nor its repository contain; the MIT text is reproduced from the SPDX licence list."

[[appendix]]
title = "Rust standard library"
intro = """
Every Rust program links the Rust standard library. Its copyright and licence
notices, copied from the toolchain that built this binary, are in
RUST-STD-COPYRIGHT.html next to this file.
"""

[[appendix]]
title = "musl libc"
targets = ["x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"]
intro = """
This Linux build is statically linked against musl libc as shipped with Rust's
musl targets. The musl release the building toolchain uses, and that release's
COPYRIGHT file, follow.
"""
musl_from_rustc = true
