[workspace]
members = ["ant-core", "ant-cli"]
resolver = "2"

[patch.crates-io]
# The published ant-protocol 3.0.0 has no `Pointer` record or wire messages
# (ADR-0016); 3.1.0 is that release plus them. The only patch needed, and only
# until 3.1.0 is published. A rev, so the pin is immutable.
ant-protocol = { git = "https://github.com/WithAutonomi/ant-protocol", rev = "4412b6af4fab2ceb0a4e1efea1efca08e68c6e4e" }
