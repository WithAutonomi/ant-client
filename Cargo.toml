[workspace]
members = ["ant-core", "ant-cli"]
resolver = "2"

[patch.crates-io]
# The published ant-protocol 3.1.0 has pointers (ADR-0016) but not the final
# state that ownership transfer relies on (ADR-0018 in ant-node). Pin the
# companion revision until a release includes it. Versions are bumped at
# release; this immutable revision remains 3.1.0.
ant-protocol = { git = "https://github.com/WithAutonomi/ant-protocol", rev = "9ad7fce38aa2b79ea6c532985930a3f347ab529b" }
