name: ant release

on:
  push:
    tags:
      - "ant-cli-v*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: install cross
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo "CC_x86_64_unknown_linux_musl=musl-gcc" >> $GITHUB_ENV

      - name: build
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            cross build --release --target ${{ matrix.target }} --bin ant
          else
            cargo build --release --target ${{ matrix.target }} --bin ant
          fi

      - name: determine version
        id: version
        shell: bash
        run: |
          version=$(grep '^version' ant-cli/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=${version}" >> $GITHUB_OUTPUT

      - name: package (unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          staging="ant-${{ steps.version.outputs.version }}-${{ matrix.target }}"
          mkdir "$staging"
          cp "target/${{ matrix.target }}/release/ant" "$staging/"
          cp "ant-core/resources/bootstrap_peers.toml" "$staging/"
          tar czf "$staging.tar.gz" "$staging"
          echo "ASSET=$staging.tar.gz" >> $GITHUB_ENV

      - name: package (windows)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          staging="ant-${{ steps.version.outputs.version }}-${{ matrix.target }}"
          mkdir "$staging"
          cp "target/${{ matrix.target }}/release/ant.exe" "$staging/"
          cp "ant-core/resources/bootstrap_peers.toml" "$staging/"
          7z a "$staging.zip" "$staging"
          echo "ASSET=$staging.zip" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: ant-${{ matrix.target }}
          path: ${{ env.ASSET }}

  sign-windows:
    name: sign windows binary
    runs-on: windows-latest
    needs: [build]
    env:
      SM_HOST: ${{ secrets.SM_HOST }}
      SM_API_KEY: ${{ secrets.SM_API_KEY }}
      SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}
      SM_KEYPAIR_ALIAS: ${{ secrets.SM_KEYPAIR_ALIAS }}
      SM_LOG_LEVEL: trace
      SM_LOG_FILE: ${{ github.workspace }}\smctl-signing.log
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ant-x86_64-pc-windows-msvc
          path: artifacts/

      - name: extract binary for signing
        shell: bash
        run: |
          cd artifacts
          7z x *.zip
          # Find and copy the exe to a known location
          find . -name "ant.exe" -exec cp {} ant.exe \;

      - name: create client certificate file
        id: prepare_cert
        shell: pwsh
        run: |
          $raw = @'
          ${{ secrets.SM_CLIENT_CERT_B64 }}
          '@

          $clean = ($raw -replace '\s','')

          if ([string]::IsNullOrWhiteSpace($clean)) {
            Write-Error "SM_CLIENT_CERT_B64 is empty after normalization."
            exit 1
          }

          try {
            $certBytes = [Convert]::FromBase64String($clean)
          } catch {
            Write-Error "SM_CLIENT_CERT_B64 is not valid Base64."
            exit 1
          }

          $certPath = Join-Path $env:RUNNER_TEMP "Certificate.p12"
          [System.IO.File]::WriteAllBytes($certPath, $certBytes)

          "SM_CLIENT_CERT_FILE=$certPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          "sm_client_cert_b64=$clean" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: setup DigiCert SSM tools
        uses: digicert/ssm-code-signing@v1.2.1
        with:
          sm_host: ${{ secrets.SM_HOST }}
          sm_api_key: ${{ secrets.SM_API_KEY }}
          sm_client_cert_b64: ${{ steps.prepare_cert.outputs.sm_client_cert_b64 }}
          sm_client_cert_password: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}

      - name: verify smctl installation
        shell: pwsh
        run: |
          smctl -v
          smctl healthcheck

      - name: sign ant.exe
        shell: pwsh
        run: |
          $file = "artifacts\ant.exe"
          $result = & smctl sign --keypair-alias "$env:SM_KEYPAIR_ALIAS" --input "$file" 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Signing failed: $result"
            exit 1
          }
          Write-Host "Successfully signed ant.exe"

      - name: verify signature
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature "artifacts\ant.exe"
          Write-Host "Status: $($sig.Status)"
          Write-Host "Signer: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne "Valid") {
            Write-Error "Signature validation failed"
            exit 1
          }

      - name: repackage signed archive
        shell: bash
        run: |
          version=$(grep '^version' ant-cli/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          staging="ant-${version}-x86_64-pc-windows-msvc"
          rm -rf "$staging"
          mkdir "$staging"
          cp artifacts/ant.exe "$staging/"
          cp ant-core/resources/bootstrap_peers.toml "$staging/"
          7z a "$staging.zip" "$staging"

      - uses: actions/upload-artifact@v4
        with:
          name: ant-x86_64-pc-windows-msvc-signed
          path: ant-*-x86_64-pc-windows-msvc.zip

      - name: upload signing logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: signing-logs
          path: ${{ github.workspace }}\smctl-signing.log
          if-no-files-found: ignore

  sign-releases:
    name: sign release artifacts
    runs-on: ubuntu-latest
    needs: [build, sign-windows]
    steps:
      - name: download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: download signed windows artifact
        uses: actions/download-artifact@v4
        with:
          name: ant-x86_64-pc-windows-msvc-signed
          path: artifacts-signed-win

      - name: replace windows archive with signed version
        run: |
          rm -f artifacts/ant-*-x86_64-pc-windows-msvc.zip
          cp artifacts-signed-win/*.zip artifacts/

      - name: download ant-keygen
        run: |
          gh release download --repo WithAutonomi/ant-keygen --pattern 'ant-keygen-linux-x64.tar.gz' --dir /tmp
          tar -xzf /tmp/ant-keygen-linux-x64.tar.gz -C /tmp
          chmod +x /tmp/ant-keygen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: decode signing key
        run: |
          echo "${{ secrets.ANT_SIGNING_KEY }}" | xxd -r -p > /tmp/signing-key.secret
          chmod 600 /tmp/signing-key.secret

      - name: sign all release files
        run: |
          for file in artifacts/ant-*.tar.gz artifacts/ant-*.zip; do
            if [ -f "$file" ]; then
              echo "Signing $file..."
              /tmp/ant-keygen sign \
                --key /tmp/signing-key.secret \
                --input "$file" \
                --output "${file}.sig" \
                --context "ant-release-v1"
            fi
          done

      - name: clean up signing key
        if: always()
        run: shred -u /tmp/signing-key.secret 2>/dev/null || rm -f /tmp/signing-key.secret

      - name: generate checksums
        run: |
          cd artifacts
          files=$(ls ant-*.tar.gz ant-*.zip ant-*.sig 2>/dev/null)
          if [ -z "$files" ]; then
            echo "ERROR: No release artifacts found to checksum"
            exit 1
          fi
          sha256sum $files > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: signed-releases
          path: artifacts/*
          retention-days: 1

  release:
    name: create github release
    runs-on: ubuntu-latest
    needs: [sign-releases]
    steps:
      - uses: actions/checkout@v4

      - name: determine version and prerelease
        id: meta
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#ant-cli-v}"
          echo "tag=${tag}" >> $GITHUB_OUTPUT
          echo "version=${version}" >> $GITHUB_OUTPUT
          # Any semver pre-release component makes this a GitHub prerelease. `-beta.N` builds
          # ship to the beta channel and `-rc.N` builds are cut before the release gates have
          # given a verdict, so neither may be published as a full release. The test is the
          # general one rather than an `alpha|beta|rc` list so an unanticipated suffix fails
          # closed, as a prerelease, instead of silently going out as "Latest".
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/download-artifact@v4
        with:
          name: signed-releases
          path: assets/

      - name: extract changelog entry
        id: changelog
        shell: bash
        run: |
          # Extract the changelog section for the version being released — NOT
          # "the first section". Blindly taking the first section shipped the
          # ever-growing `[Unreleased]` blob as the notes of every release from
          # 0.2.x through 0.3.4 (0.3.4's notes were byte-identical to 0.3.3's;
          # the dual-stack entry re-shipped for four months). See V2-1107.
          #
          # `-rc.N` / `-beta.N` builds share the base version's section: the
          # section is created when the train cuts rc.1 (rotate `[Unreleased]`
          # into `[X.Y.Z] - <date>` as part of the cut), so every prerelease
          # and the final stable of one train ship the same, correct, notes.
          version="${{ steps.meta.outputs.version }}"
          base_version="${version%%-*}"
          changelog=$(awk -v ver="$base_version" '
            BEGIN { gsub(/\./, "\\.", ver); pat = "^## \\[" ver "\\]" }
            $0 ~ pat { found = 1; next }
            /^## \[/ { if (found) exit }
            found' CHANGELOG.md)
          # A missing or empty section must never stop a release. The artifacts are
          # fine and the notes are fixable after the fact with `gh release edit`, so
          # failing closed here would only turn "missing notes" into "no release at
          # all". The `::warning::` annotation keeps the omission loud on the run.
          # Pre-tag enforcement, if we want it, belongs on the release-prep PR where
          # a fix is cheap and nothing is blocked.
          if [ -z "$(echo "$changelog" | tr -d '[:space:]')" ]; then
            echo "::warning title=Missing changelog section::CHANGELOG.md has no non-empty '## [${base_version}]' section. Publishing with placeholder notes; correct them with 'gh release edit' and rotate '## [Unreleased]' into '## [${base_version}] - $(date -u +%F)'. See V2-1107."
            cat > /tmp/changelog_entry.md <<EOF
          _No changelog entry was recorded for ${base_version}. See the commit history for the changes in this release; these notes will be corrected retroactively._
          EOF
          else
            # Write to file for the release body
            echo "$changelog" > /tmp/changelog_entry.md
          fi

      - name: generate release body
        shell: bash
        run: |
          version="${{ steps.meta.outputs.version }}"

          # The quick-start installers always fetch the latest stable release, so a
          # pre-release page must not offer them as the way to get *this* build.
          if [[ "${{ steps.meta.outputs.prerelease }}" == "true" ]]; then
            cat > /tmp/release_body.md << 'PRERELEASE'
          > **This is a pre-release.** The quick-start installers below are not used for it —
          > they always install the latest stable `ant`. Install this build from the assets below.

          `-beta.N` builds are the beta channel of the `ant` client. Once a beta build is on your
          `PATH`, `ant update` keeps you on beta: a beta build tracks the beta channel by default,
          accepting later `-beta.N` and stable releases but never a release candidate. To leave the
          beta channel, install a stable build manually.

          `-rc.N` builds are cut before the release gates have given a verdict and are not installed
          by `ant update` on any channel.

          ## Installation

          ### Manual download
          PRERELEASE
          else
            cat > /tmp/release_body.md << 'HEADER'
          ## Installation

          ### Linux / macOS (quick-start)

          ```bash
          curl -fsSL https://raw.githubusercontent.com/WithAutonomi/ant-client/main/install.sh | bash
          ```

          ### Windows (quick-start)

          ```powershell
          irm https://raw.githubusercontent.com/WithAutonomi/ant-client/main/install.ps1 | iex
          ```

          ### Manual download
          HEADER
          fi

          cat >> /tmp/release_body.md << 'BODY'

          Download the archive for your platform from the assets below, extract it, and place the `ant` binary on your `PATH`. Copy `bootstrap_peers.toml` to the appropriate config directory:

          | Platform | Config path |
          |----------|-------------|
          | Linux | `~/.config/ant/bootstrap_peers.toml` |
          | macOS | `~/Library/Application Support/ant/bootstrap_peers.toml` |
          | Windows | `%APPDATA%\ant\bootstrap_peers.toml` |

          ## Verification

          All release archives are signed with ML-DSA-65 (FIPS 204) post-quantum signatures. Download `ant-keygen` from [WithAutonomi/ant-keygen](https://github.com/WithAutonomi/ant-keygen/releases) and the public key from [`resources/release-signing-key.pub`](https://raw.githubusercontent.com/WithAutonomi/ant-client/main/resources/release-signing-key.pub), then verify:

          ```bash
          ant-keygen verify --key release-signing-key.pub --input <file> --signature <file>.sig --context ant-release-v1
          ```

          The Windows binary (`ant.exe`) is additionally signed with a DigiCert EV code-signing certificate. Windows will verify this signature automatically on download and execution.

          SHA256 checksums provided in `SHA256SUMS.txt`.

          BODY

          echo "## Detailed Changes" >> /tmp/release_body.md
          echo "" >> /tmp/release_body.md
          cat /tmp/changelog_entry.md >> /tmp/release_body.md

      - name: create github release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # `--latest=false` on a pre-release is redundant with GitHub's own rule that a
          # prerelease can never be "Latest", but stating it keeps the guarantee independent
          # of gh and API defaults.
          release_flags="--latest"
          if [[ "${{ steps.meta.outputs.prerelease }}" == "true" ]]; then
            release_flags="--prerelease --latest=false"
          fi

          gh release create "${{ steps.meta.outputs.tag }}" \
            --title "ant ${{ steps.meta.outputs.version }}" \
            --notes-file /tmp/release_body.md \
            $release_flags \
            assets/*.tar.gz \
            assets/*.zip \
            assets/*.sig \
            assets/SHA256SUMS.txt

  publish-npm:
    name: publish to npm
    runs-on: ubuntu-latest
    needs: [release]
    permissions:
      contents: read
      # Required for npm provenance: npm exchanges this token with Sigstore to attest which
      # workflow run and commit produced each tarball.
      id-token: write
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      # The GitHub release is already published by this point. A missing or misconfigured npm
      # credential must not turn a successful release red, so the job warns and stops instead —
      # the same principle as the changelog handling above.
      - name: check for npm credentials
        id: creds
        shell: bash
        run: |
          if [ -z "${NPM_TOKEN}" ]; then
            echo "::warning title=npm publish skipped::NPM_TOKEN is not configured, so @withautonomi/ant was not published for this release. The GitHub release is unaffected."
            echo "configured=false" >> $GITHUB_OUTPUT
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.configured == 'true'

      - name: determine version and dist-tag
        id: meta
        if: steps.creds.outputs.configured == 'true'
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#ant-cli-v}"
          echo "version=${version}" >> $GITHUB_OUTPUT

          # Which npm dist-tag this release becomes. Deliberately mirrors
          # `version_matches_channel` in ant-core/src/channel.rs and install.sh: the first
          # dot-separated pre-release identifier decides, so `betamax.1` is not mistaken for a
          # beta. An unrecognised suffix fails the job rather than guessing — publishing an
          # unknown build to `latest` would hand it to every `npm install -g` user.
          pre=""
          if [ "$version" != "${version%%-*}" ]; then
            pre="${version#*-}"
          fi

          if [ -z "$pre" ]; then
            dist_tag="latest"
          else
            case "${pre%%.*}" in
              beta) dist_tag="beta" ;;
              # Release candidates are cut before the release gates report. Nothing installs them
              # today — not install.sh, not `ant update` on any channel — so they get their own
              # tag and must never move `latest`.
              rc)   dist_tag="rc" ;;
              *)
                echo "::error title=Unrecognised pre-release::Version ${version} has pre-release identifier '${pre%%.*}', which maps to no npm dist-tag."
                exit 1
                ;;
            esac
          fi

          echo "dist_tag=${dist_tag}" >> $GITHUB_OUTPUT
          echo "Publishing ${version} to dist-tag ${dist_tag}"

      - uses: actions/download-artifact@v4
        if: steps.creds.outputs.configured == 'true'
        with:
          name: signed-releases
          path: artifacts/

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.configured == 'true'
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: download ant-keygen
        if: steps.creds.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download --repo WithAutonomi/ant-keygen --pattern 'ant-keygen-linux-x64.tar.gz' --dir /tmp
          tar -xzf /tmp/ant-keygen-linux-x64.tar.gz -C /tmp
          chmod +x /tmp/ant-keygen

      # Verifies every archive against SHA256SUMS.txt and every ML-DSA-65 signature against the
      # committed public key before copying a byte, then unpacks the binaries into the package
      # trees. Nothing is rebuilt, so the published binaries are byte-identical to the release
      # assets uploaded in the previous job.
      - name: build npm packages
        if: steps.creds.outputs.configured == 'true'
        run: |
          npm/build-packages.sh \
            --version "${{ steps.meta.outputs.version }}" \
            --artifacts artifacts \
            --out dist \
            --keygen /tmp/ant-keygen

      - name: publish packages
        if: steps.creds.outputs.configured == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
          DIST_TAG: ${{ steps.meta.outputs.dist_tag }}
        shell: bash
        run: |
          set -euo pipefail

          # The meta package pins its platform packages by exact version, so they must exist in
          # the registry before it is published.
          publish() {
            local dir="$1"
            local name
            name="$(node -p "require('./${dir}/package.json').name")"

            # A re-run after a partial publish must not fail on the packages that already went
            # out. Anything else npm rejects is a real error and still fails the job.
            if npm view "${name}@${VERSION}" version >/dev/null 2>&1; then
              echo "::notice title=Already published::${name}@${VERSION} is already in the registry; skipping."
              return 0
            fi

            echo "Publishing ${name}@${VERSION} to dist-tag ${DIST_TAG}"
            ( cd "$dir" && npm publish --access public --provenance --tag "$DIST_TAG" )
          }

          for pkg in dist/ant-*; do
            publish "$pkg"
          done
          publish dist/ant

      - name: summary
        if: steps.creds.outputs.configured == 'true'
        shell: bash
        run: |
          {
            echo "### npm"
            echo
            echo "Published \`@withautonomi/ant@${{ steps.meta.outputs.version }}\` to dist-tag \`${{ steps.meta.outputs.dist_tag }}\`."
            echo
            echo '```sh'
            if [ "${{ steps.meta.outputs.dist_tag }}" = "latest" ]; then
              echo "npm install -g @withautonomi/ant"
            else
              echo "npm install -g @withautonomi/ant@${{ steps.meta.outputs.dist_tag }}"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
