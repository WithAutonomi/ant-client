[package]
name = "ant-core"
version = "0.5.1"
edition = "2021"
description = "Headless Rust library for the Autonomi network: data storage and retrieval with self-encryption and EVM payments, plus node lifecycle management."
license = "MIT OR Apache-2.0"
repository = "https://github.com/WithAutonomi/ant-client"
readme = "../README.md"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
# Cross-platform data primitives. These are the only dependencies compiled for
# the browser-WASM target; native networking and node management stay behind
# the `native` feature below.
blake3 = "1"
base64 = "0.22"
bytes = "1"
hex = "0.4"
postcard = { version = "1.1.3", features = ["use-std"] }
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
self_encryption = "0.36"
saorsa-dht-lookup = { version = "0.1.0", path = "../../saorsa-core-web-support/crates/saorsa-dht-lookup" }
thiserror = "2"
tiny-keccak = { version = "2", features = ["keccak"] }
url = "2"

# Node management
async-stream = { version = "0.3", optional = true }
axum = { version = "0.8", optional = true }
flate2 = { version = "1", optional = true }
fs2 = { version = "0.4", optional = true }
futures-core = { version = "0.3", optional = true }
futures-channel = { version = "0.3", optional = true }
futures-util = { version = "0.3", optional = true }
self-replace = { version = "1", optional = true }
semver = { version = "1", optional = true }
reqwest = { version = "0.12", features = ["json", "stream"], optional = true }
tar = { version = "0.4", optional = true }
tempfile = { version = "3", optional = true }
toml = { version = "0.8", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
tokio-util = { version = "0.7", features = ["rt"], optional = true }
utoipa = { version = "5", features = ["axum_extras"], optional = true }
zip = { version = "2", optional = true }
tower-http = { version = "0.6.8", features = ["cors"], optional = true }

# Data operations
# Wire protocol crate: gives us `ant_protocol::{chunk, payment, …}` plus
# re-exports of `evmlib`, `saorsa-core` (transport), and `saorsa-pqc`
# under `ant_protocol::{evm, transport, pqc}`. This is the ONE pin for
# those three deps — do not add direct evmlib/saorsa-core/saorsa-pqc
# deps here or the version can skew between ant-client and ant-node.
ant-protocol = { version = "2.3.1", optional = true }
xor_name = { version = "5", optional = true }
futures = { version = "0.3", optional = true }
tracing = { version = "0.1", optional = true }
lru = { version = "0.16", optional = true }
rand = { version = "0.8", optional = true }
# Used by the daemon supervisor to scan the OS process table when adopting
# running nodes whose pid file is missing (e.g. nodes spawned by a pre-adoption
# daemon). Happy-path adoption reads the pid file directly and doesn't touch
# sysinfo, so the crate is loaded lazily and the cost is bounded to first-time
# upgrade scenarios.
sysinfo = { version = "0.32", default-features = false, features = ["system"], optional = true }
# ant-node is optional. It is only linked for the `LocalDevnet` wrapper
# that spawns a local in-process network for development and testing.
# Enable with `--features devnet`.
#
# Must track the same `saorsa-core` / `ant-protocol` line as the
# `ant-protocol` pin above — a version skew pulls a second copy of
# `saorsa-core` into the graph and makes `ant_node`'s and `ant_protocol`'s
# `MultiAddr` mutually incompatible in `node/devnet.rs`. While the runtime
# `ant-protocol` pin above points at a released version, this ant-node must
# track the matching released version carrying the same saorsa-core /
# ant-protocol lineage.
ant-node = { version = "0.16.0", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

# Browser bindings are optional so ordinary native consumers do not pull the
# wasm-bindgen toolchain into their dependency graph.
js-sys = { version = "0.3", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "Event",
    "MessageEvent",
    "RtcConfiguration",
    "RtcDataChannel",
    "RtcDataChannelInit",
    "RtcDataChannelState",
    "RtcDataChannelType",
    "RtcPeerConnection",
    "RtcSdpType",
    "RtcSessionDescriptionInit",
] }
gloo-timers = { version = "0.3", features = ["futures"], optional = true }
# `ant-protocol` currently pulls native Tokio networking on wasm32. Use the
# same FIPS-204 primitive as `saorsa-pqc` for verification-only browser builds
# until ant-protocol's pure wire layer can be built independently of transport.
fips204 = { version = "0.4.6", default-features = false, features = ["ml-dsa-65"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# self_encryption/rand use getrandom 0.2. Browser entropy is supplied by the
# Web Crypto API through its `js` feature.
getrandom = { version = "0.2", features = ["js"] }
console_error_panic_hook = { version = "0.1", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
# Vendored OpenSSL ensures openssl-sys links statically for musl targets.
# Without this, the musl CI builds fail because the runners lack musl-compatible
# OpenSSL dev libraries. Not needed on Windows (uses schannel via native-tls).
openssl = { version = "0.10", features = ["vendored"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading"] }

[features]
# Preserve the existing native ant-core API for ordinary consumers. WASM
# consumers build with `--no-default-features --features browser-wasm`.
default = ["native"]
native = [
    "dep:ant-protocol",
    "dep:async-stream",
    "dep:axum",
    "dep:flate2",
    "dep:fs2",
    "dep:futures",
    "dep:futures-core",
    "dep:futures-util",
    "dep:lru",
    "dep:rand",
    "dep:reqwest",
    "dep:self-replace",
    "dep:semver",
    "dep:sysinfo",
    "dep:tar",
    "dep:tempfile",
    "dep:tokio",
    "dep:tokio-util",
    "dep:toml",
    "dep:tower-http",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:utoipa",
    "dep:xor_name",
    "dep:zip",
]
browser-wasm = [
    "dep:console_error_panic_hook",
    "dep:futures-channel",
    "dep:futures-util",
    "dep:gloo-timers",
    "dep:js-sys",
    "dep:fips204",
    "dep:serde-wasm-bindgen",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
]
# Enable `LocalDevnet` (ant-core/src/node/devnet.rs) which wraps
# `ant_node::devnet::Devnet` and an Anvil EVM testnet.
devnet = ["native", "dep:ant-node"]
# Expose test-only client seams (e.g. forcing the ADR-0002 extended PUT
# fallback) used by the e2e/integration test suite.
test-utils = []

[dev-dependencies]
# Test infrastructure in tests/support/mod.rs spawns real ant-nodes
# in-process to exercise the wire protocol end-to-end. ant-node is a
# dev-dep here (separate from the optional runtime dep above) so tests
# always compile even without the `devnet` feature. Pinned to the same
# version as the runtime dep so there is a single ant-node /
# saorsa-core version across the whole graph.
ant-node = { version = "0.16.0", features = ["test-utils"] }
serial_test = "3"
anyhow = "1"
alloy = { version = "1.6", features = ["node-bindings"] }
tokio-test = "0.4"
rmp-serde = "1"

[[example]]
name = "start-local-devnet"
path = "examples/start-local-devnet.rs"
# `LocalDevnet` (and therefore this example) is gated behind `devnet`.
# Running under default features would produce a confusing "LocalDevnet
# not found" error, so require the feature explicitly.
required-features = ["devnet"]

[[example]]
name = "start-devnet-sepolia"
path = "examples/start-devnet-sepolia.rs"

[[example]]
name = "bench-quoting"
path = "examples/bench-quoting.rs"

[[test]]
name = "e2e_chunk"
path = "tests/e2e_chunk.rs"

[[test]]
name = "e2e_data"
path = "tests/e2e_data.rs"

[[test]]
name = "e2e_file"
path = "tests/e2e_file.rs"

[[test]]
name = "e2e_payment"
path = "tests/e2e_payment.rs"

[[test]]
name = "e2e_security"
path = "tests/e2e_security.rs"

[[test]]
name = "unit_self_encrypt"
path = "tests/unit_self_encrypt.rs"

[[test]]
name = "merkle_unit"
path = "tests/merkle_unit.rs"

[[test]]
name = "e2e_merkle"
path = "tests/e2e_merkle.rs"

[[test]]
name = "e2e_huge_file"
path = "tests/e2e_huge_file.rs"

[[test]]
name = "e2e_upload_costs"
path = "tests/e2e_upload_costs.rs"

[[test]]
name = "datamap_file"
path = "tests/datamap_file.rs"
